name: Verify adaptive engine

on:
  push:
    branches: [main, feat/adaptive-vocabulary-p0, feat/adaptive-static-preview, feat/adaptive-data-integration, feat/automatic-three-way-sync-merge-2026-11-22]
  pull_request:
    branches: [main, feat/adaptive-static-preview]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
