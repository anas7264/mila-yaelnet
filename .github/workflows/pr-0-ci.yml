name: Production Runtime CI (Node 26)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci/pr-0-node26-runtime-baseline

jobs:
  test:
    name: npm test (Node 26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run test suite
        run: npm test
