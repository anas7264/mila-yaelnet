<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111c2d">
  <meta name="description" content="منصة شخصية متقدمة للتدرب على مفردات العبرية والاستعداد لامتحان יעלנט.">
  <title>מילה — مختبر العبرية</title>
  <link rel="manifest" href="/manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/academic-terms.css?v=2">
  <link rel="stylesheet" href="/static/adaptive.css"></head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="/" data-action="go-dashboard">
        <span class="brand-mark">מ</span>
        <span class="brand-copy"><strong>מילה</strong><small>YAELNET LEARNING STUDIO</small></span>
      </a>
      <div class="workspace-label"><span class="live-dot"></span> مساحة التعلّم الشخصية</div>
      <nav id="mainNav" class="main-nav">
        <p class="nav-caption">مساحة العمل</p>
        <button class="nav-item active" type="button" data-view="dashboard"><span class="nav-icon">⌂</span><span>الرئيسية</span><kbd>1</kbd></button>
        <button class="nav-item" type="button" data-view="stages"><span class="nav-icon">▤</span><span>المراحل التعليمية</span><span id="stageNavCount" class="nav-count">1</span></button>
        <button class="nav-item" type="button" data-view="studio"><span class="nav-icon">✳</span><span>مختبر التدريب</span><span class="nav-chip">PRO</span></button>
        <p class="nav-caption nav-caption-spaced">المراجعة والمعرفة</p>
        <button class="nav-item" type="button" data-view="library"><span class="nav-icon">▦</span><span>مكتبة الكلمات</span><span id="libraryNavCount" class="nav-count">15</span></button>
        <button class="nav-item" type="button" data-view="review"><span class="nav-icon">↻</span><span>مركز المراجعة</span><span id="reviewNavCount" class="nav-count accent-count">0</span></button>
        <button class="nav-item" type="button" data-view="analytics"><span class="nav-icon">▥</span><span>التحليلات والأداء</span></button>
        <p class="nav-caption nav-caption-spaced">التخصيص</p>
        <button class="nav-item" type="button" data-view="settings"><span class="nav-icon">⚙</span><span>الإعدادات والنسخ</span></button>
      </nav>
      <div class="sidebar-stage-block">
        <div class="sidebar-stage-heading"><span>مراحلك</span><button type="button" class="text-button" data-view="stages">عرض الكل</button></div>
        <div id="stageNav" class="stage-nav"></div>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-footer-mark">✦</div>
        <div><strong>تعلم بذكاء، لا بكثرة</strong><small>مراجعات صغيرة تصنع فرقًا كبيرًا</small></div>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-leading">
          <button id="mobileMenuButton" class="icon-button mobile-menu" type="button" aria-label="فتح القائمة" data-action="toggle-sidebar">☰</button>
          <div class="breadcrumb"><span>מילה</span><i>/</i><strong id="breadcrumbTitle">الرئيسية</strong></div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-streak" title="سلسلة أيام الدراسة"><span>✦</span><strong id="streakCount">0</strong><small>يوم متتالٍ</small></div>
          <button class="icon-button" type="button" data-action="toggle-theme" aria-label="تغيير المظهر" title="تغيير المظهر">◐</button>
          <button class="topbar-quick" type="button" data-action="open-studio">ابدأ تدريبًا <span>↗</span></button>
        </div>
      </header>
      <div id="appView" class="app-view" tabindex="-1" aria-live="polite">
        <div class="loading-state"><span class="loading-orbit"></span><p>يتم تجهيز مساحة التعلّم…</p></div>
      </div>
      <footer class="app-footer"><span>מילה · YAELNET PERSONAL LEARNING STUDIO</span><span>بياناتك محفوظة محليًا على هذا الجهاز</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modalRoot"></div>
  <script src="/static/catalog.js"></script>
  <script src="/static/quiz-engine.js"></script>
  <script src="/static/storage.js"></script>
<script src="/academic-terms.js?v=2"></script>
<script src="/static/expanded-vocabulary.js?v=1"></script>
  <script src="/static/app.js"></script>
<script>window.MILA_ADAPTIVE_ENABLED = true;</script>
<script src="/static/adaptive-engine.js?v=2"></script>
<script src="/static/adaptive-ui.js?v=2"></script>
<script src="/sync-config.js?v=3"></script>
<script type="module">
  import('/sync.js?v=3').catch((error) => {
    console.error('Mila sync module failed to load', error);
    const showFailure = () => {
      const target = document.querySelector('#appView .settings-layout');
      if (!target) return;
      let card = document.getElementById('mila-sync-card');
      if (!card) {
        card = document.createElement('section');
        card.id = 'mila-sync-card';
        card.setAttribute('aria-label', 'مزامنة البيانات');
        card.style.cssText = 'direction:rtl;margin:22px 0;padding:18px;border:1px solid #bd5545;border-radius:14px;background:var(--surface,#fff);color:inherit';
        card.innerHTML = '<strong>مزامنة البيانات</strong><div id="mila-sync-status" role="alert" aria-live="polite" style="margin:10px 0;line-height:1.8"></div><button id="mila-sync-retry" type="button">إعادة المحاولة</button>';
        target.prepend(card);
      }
      const status = document.getElementById('mila-sync-status');
      if (status) {
        status.textContent = 'تعذر تحميل وحدة المزامنة. بياناتك المحلية لم تتأثر؛ أعد المحاولة بعد تحديث الصفحة.';
        status.dataset.state = 'error';
      }
      const retry = document.getElementById('mila-sync-retry');
      if (retry) {
        retry.hidden = false;
        retry.onclick = () => location.reload();
      }
    };
    const view = document.getElementById('appView') || document.documentElement;
    const observer = new MutationObserver(showFailure);
    observer.observe(view, { childList: true, subtree: true });
    showFailure();
  });
</script>
</body>
</html>
